<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ŞİFRELİ CHAT PORTALI</title>
    <style>
        body { background: black; color: #00ff00; font-family: 'Courier New', monospace; overflow-x: hidden; margin: 0; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .container { position: relative; z-index: 1; text-align: center; padding: 20px; }
        h1 {
            font-size: 2.5rem; font-weight: bold; text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            animation: glitch 1s infinite; letter-spacing: 3px;
        }
        @keyframes glitch {
            0% { transform: skew(0deg); text-shadow: 2px 2px #ff0000; }
            20% { transform: skew(-3deg); text-shadow: -2px -2px #0000ff; }
            40% { transform: skew(1deg); text-shadow: 2px -2px #00ff00; }
            100% { transform: skew(0deg); }
        }
        .box { 
            border: 2px solid #00ff00; background: rgba(0, 0, 0, 0.9); 
            padding: 25px; margin: 20px auto; width: 90%; max-width: 500px; 
            box-shadow: 0 0 30px #00ff00; border-radius: 15px;
        }
        input { 
            background: #000; color: #00ff00; border: 1px solid #00ff00; 
            padding: 12px; width: 90%; margin-bottom: 10px; font-size: 16px; outline: none;
        }
        button { 
            background: #00ff00; color: black; padding: 12px; 
            border: none; cursor: pointer; font-weight: bold; 
            width: 100%; font-size: 16px; transition: 0.3s; margin-top: 5px;
        }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        
        /* YENİ TUŞ TASARIMI */
        .discovery-btn {
            background: transparent; color: #ff0000; border: 2px solid #ff0000;
            margin-top: 30px; width: auto; display: inline-block; padding: 10px 20px;
            text-decoration: none; font-size: 14px; transition: 0.5s;
            box-shadow: 0 0 10px #ff0000;
        }
        .discovery-btn:hover { background: #ff0000; color: white; box-shadow: 0 0 30px #ff0000; }
        
        #sonucAlani { margin-top: 20px; border-top: 1px dashed #00ff00; padding-top: 15px; display: none; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="container">
        <h1>[ ŞİFRELİ CHAT PORTALI ]</h1>
        
        <div class="box">
            <input type="text" id="mesaj" placeholder="Mesajı yaz reisim..." required>
            <input type="number" id="anahtar" placeholder="Şifre Anahtarı (Örn: 5)..." required>
            <button onclick="sifrele()">SİSTEME GÖNDER VE ŞİFRELE</button>
            
            <div id="sonucAlani">
                <h3 style="color: #fff;">OPERASYON BAŞARILI:</h3>
                <p id="sonucMetni" style="font-size: 22px; color: #00ff00; font-weight: bold; word-wrap: break-word;"></p>
            </div>
        </div>

        <a href="kesif.html" class="discovery-btn">>> GİZLİ SİBER KAYNAKLARA ERİŞ <<</a>
    </div>

    <script>
<div id="intel-screen" style="position: fixed; bottom: 20px; left: 20px; background: rgba(0,20,0,0.9); border: 1px solid #0f0; padding: 15px; color: #0f0; font-family: monospace; font-size: 11px; z-index: 2000; border-radius: 5px; box-shadow: 0 0 15px #0f0;">
    <div style="border-bottom: 1px solid #0f0; margin-bottom: 5px; font-weight: bold;">[ HEDEF ANALİZİ ]</div>
    <div id="user-ip">IP: Taranıyor...</div>
    <div id="user-device">CIHAZ: Tespit Ediliyor...</div>
    <div id="user-os">SISTEM: Analiz Ediliyor...</div>
</div>

<div id="chat-container" style="margin-top: 50px;">
    <input type="text" id="secret-msg" placeholder="İmha edilecek mesaj..." style="background: black; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 250px;">
    <button onclick="mesajiGonder()" style="background: #0f0; color: black; border: none; padding: 10px; cursor: pointer; font-weight: bold;">GÖNDER VE ZAMANLA</button>
    <div id="msg-display" style="margin-top: 20px; font-size: 1.5em; color: #0f0;"></div>
</div>
        
</script>
<div id="intel-screen" style="position: fixed; bottom: 20px; left: 20px; background: rgba(0, 0, 0, 0.85); border: 1px solid #00ff00; padding: 12px; color: #00ff00; font-family: 'Courier New', monospace; font-size: 11px; z-index: 9999; border-radius: 5px; box-shadow: 0 0 10px #00ff00;">
    <div style="border-bottom: 1px solid #00ff00; margin-bottom: 5px; font-weight: bold; text-align: center;">[ HEDEF ANALİZİ ]</div>
    <div id="user-ip">IP: Taranıyor...</div>
    <div id="user-device">CIHAZ: Tespit Ediliyor...</div>
    <div id="user-os">SISTEM: Analiz Ediliyor...</div>
</div>

<div id="shredder-area" style="margin-top: 30px; border: 1px solid #ff0000; padding: 15px; background: rgba(20, 0, 0, 0.6); border-radius: 8px;">
    <h3 style="color: #ff0000; margin-top: 0; font-size: 14px;">☢️ SELF-DESTRUCT PROTOKOLÜ</h3>
    <input type="text" id="secret-msg" placeholder="İmha edilecek mesaj..." style="background: #111; color: #ff0000; border: 1px solid #ff0000; padding: 10px; width: 80%; margin-bottom: 10px; font-family: monospace;">
    <button onclick="mesajiGonder()" style="background: #ff0000; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; width: 85%;">GÖNDER VE İMHA ET</button>
    <div id="msg-display" style="margin-top: 15px; min-height: 40px; color: #0f0; font-family: monospace;"></div>
</div>

<script>
// İSTİHBARAT FONKSİYONU
function bilgileriGetir() {
    document.getElementById('user-device').innerText = "CIHAZ: " + navigator.platform;
    document.getElementById('user-os').innerText = "SISTEM: " + (navigator.userAgent.includes("Android") ? "Android / Mobil" : "Windows / PC");
    let randomIP = Math.floor(Math.random() * 255) + "." + Math.floor(Math.random() * 255) + ".1." + Math.floor(Math.random() * 100);
    document.getElementById('user-ip').innerText = "HEDEF IP: " + randomIP;
}
bilgileriGetir();

// İMHA FONKSİYONU
function mesajiGonder() {
    let msg = document.getElementById('secret-msg').value;
    let display = document.getElementById('msg-display');
    if(msg === "") return;

    display.innerHTML = "SİSTEME İŞLENDİ: " + msg + "<br><span id='timer' style='color:red;'>[ 5 ] saniye içinde silinecek!</span>";
    document.getElementById('secret-msg').value = "";

    let count = 5;
    let countdown = setInterval(() => {
        count--;
        if(document.getElementById('timer')) document.getElementById('timer').innerText = "[ " + count + " ] saniye içinde silinecek!";
        if(count <= 0) {
            clearInterval(countdown);
            display.innerHTML = "<span style='color:red; font-weight:bold; letter-spacing:2px;'>[ VERİ TAMAMEN İMHA EDİLDİ ]</span>";
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }
    }, 1000);
}
</script>

    </body>
</html>
