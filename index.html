<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GİZLİ KARARGAH</title>
    <style>
        body { background: black; color: #0f0; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .container { position: relative; z-index: 1; text-align: center; padding: 20px; }
        .box { border: 2px solid #0f0; background: rgba(0,0,0,0.85); padding: 20px; display: inline-block; border-radius: 15px; box-shadow: 0 0 20px #0f0; margin-top: 50px; }
        input { background: #000; color: #0f0; border: 1px solid #0f0; padding: 10px; width: 90%; margin-bottom: 10px; outline: none; }
        button { background: #0f0; color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        
        /* CANLI LİSTE PANELİ */
        #intel-panel { position: fixed; top: 20px; left: 20px; background: rgba(0,20,0,0.9); border: 2px solid #0f0; padding: 10px; font-size: 11px; z-index: 100; border-radius: 5px; box-shadow: 0 0 10px #0f0; max-width: 250px; }
        .target-item { border-bottom: 1px solid rgba(0,255,0,0.3); padding: 5px 0; }
        .blink { animation: blinker 1s linear infinite; color: red; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="intel-panel">
        <div style="font-weight: bold; text-align: center; border-bottom: 1px solid #0f0; margin-bottom: 5px;">[ 📡 CANLI TERMİNAL ]</div>
        <div id="target-list">Hedef aranıyor...</div>
    </div>

    <div class="container">
        <h1>[ ŞİFRELEME PORTALI ]</h1>
        <div class="box">
            <input type="text" id="msg" placeholder="Mesajı yaz reisim...">
            <button onclick="sifrele()">SİSTEME GÖNDER VE ŞİFRELE</button>
            <div id="result" style="margin-top:20px; color: #fff; font-weight: bold;"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // 1. FIREBASE BAĞLANTISI (Senin Görüntündeki Bilgiler)
        const firebaseConfig = {
            apiKey: "AIzaSyD8diaMwCxj4FQ-BYbBsRIUE8IPkUkPXJU",
            authDomain: "karargah-b38ec.firebaseapp.com",
            projectId: "karargah-b38ec",
            storageBucket: "karargah-b38ec.appspot.com",
            messagingSenderId: "362707587052",
            appId: "1:362707587052:web:ab663461dce3b4eedf7ac9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. MATRIX ARKA PLAN
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0"; ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        // 3. CANLI IP TAKİBİ
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                db.collection("ziyaretciler").doc(data.ip).set({
                    ip: data.ip,
                    cihaz: navigator.platform,
                    zaman: firebase.firestore.FieldValue.serverTimestamp()
                });
            });

        // LİSTEYİ GÜNCELLE
        db.collection("ziyaretciler").orderBy("zaman", "desc").limit(5)
            .onSnapshot((snapshot) => {
                const list = document.getElementById('target-list');
                list.innerHTML = "";
                snapshot.forEach((doc) => {
                    const user = doc.data();
                    list.innerHTML += `<div class="target-item"><span class="blink">●</span> HEDEF: ${user.ip}<br>CİHAZ: ${user.cihaz}</div>`;
                });
            });

        function sifrele() {
            const m = document.getElementById('msg').value;
            if(m) document.getElementById('result').innerText = "ŞİFRELENDİ: " + btoa(unescape(encodeURIComponent(m)));
        }
    </script>
</body>
</html>
