<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERHATIN SIBER PORTALI</title>
    <style>
        body { background: black; color: #00ff00; font-family: 'Courier New', monospace; overflow: hidden; margin: 0; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        .container { position: relative; z-index: 1; text-align: center; padding-top: 50px; }
        h1 {
            font-size: 3rem; font-weight: bold; text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00;
            animation: glitch 1s infinite; letter-spacing: 5px;
        }
        @keyframes glitch {
            0% { transform: skew(0deg); text-shadow: 2px 2px #ff0000; }
            20% { transform: skew(-3deg); text-shadow: -2px -2px #0000ff; }
            40% { transform: skew(1deg); text-shadow: 2px -2px #00ff00; }
            100% { transform: skew(0deg); }
        }
        .box { 
            border: 3px solid #00ff00; background: rgba(0, 0, 0, 0.85); 
            padding: 30px; margin: 20px auto; width: 85%; max-width: 550px; 
            box-shadow: 0 0 40px #00ff00; border-radius: 20px;
        }
        input { 
            background: #000; color: #00ff00; border: 1px solid #00ff00; 
            padding: 15px; width: 90%; margin-bottom: 15px; font-size: 16px; outline: none;
        }
        button { 
            background: #00ff00; color: black; padding: 15px; 
            border: none; cursor: pointer; font-weight: bold; 
            width: 100%; font-size: 18px; transition: 0.3s;
        }
        button:hover { background: #fff; box-shadow: 0 0 20px #fff; }
        #sonucAlani { margin-top: 25px; border-top: 2px solid #00ff00; padding-top: 15px; display: none; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="container">
        <h1>[ SERHATIN SIBER PORTALI ]</h1>
        <div class="box">
            <input type="text" id="mesaj" placeholder="Mesajı yaz reisim..." required>
            <input type="number" id="anahtar" placeholder="Şifre Anahtarı (Örn: 5)..." required>
            <button onclick="sifrele()">SİSTEME GÖNDER VE ŞİFRELE</button>
            
            <div id="sonucAlani">
                <h3 style="color: #fff;">OPERASYON BAŞARILI:</h3>
                <p id="sonucMetni" style="font-size: 24px; color: #00ff00; font-weight: bold;"></p>
                <p style="font-size: 12px; color: #888;">(Çözmek için anahtarı eksi (-) olarak gir)</p>
            </div>
        </div>
    </div>

    <script>
        // MATRIX EFEKTİ
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);

        // ŞİFRELEME MANTIĞI (JavaScript Versiyonu)
        function sifrele() {
            const metin = document.getElementById('mesaj').value;
            const anahtar = parseInt(document.getElementById('anahtar').value);
            let sonuc = "";

            for (let i = 0; i < metin.length; i++) {
                let c = metin[i];
                if (c.match(/[a-z]/i)) {
                    let code = metin.charCodeAt(i);
                    let start = (code >= 65 && code <= 90) ? 65 : 97;
                    sonuc += String.fromCharCode(((code - start + anahtar) % 26 + 26) % 26 + start);
                } else {
                    sonuc += c;
                }
            }
            
            document.getElementById('sonucMetni').innerText = sonuc;
            document.getElementById('sonucAlani').style.display = "block";
        }
    </script>
</body>
</html>
