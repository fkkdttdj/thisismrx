<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFY CHAT</title>
    <style>
        body { background-color: black; color: #00ff00; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }
        .container { border: 2px solid #00ff00; padding: 30px; background: rgba(0, 0, 0, 0.9); border-radius: 15px; box-shadow: 0 0 20px #00ff00; text-align: center; z-index: 1; }
        h1 { font-size: 2.5rem; text-shadow: 0 0 10px #00ff00; margin-bottom: 20px; }
        input { background: black; color: #00ff00; border: 1px solid #00ff00; padding: 10px; width: 80%; margin-bottom: 10px; outline: none; }
        button { background: #00ff00; color: black; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; }
        button:hover { background: white; box-shadow: 0 0 15px white; }
        .intel-box { position: fixed; top: 10px; left: 10px; border: 1px solid #00ff00; padding: 10px; font-size: 12px; background: rgba(0,20,0,0.8); }
        .cyber-link { color: red; margin-top: 20px; text-decoration: none; font-size: 14px; display: block; border: 1px solid red; padding: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
    </style>
</head>
<body>
    <div class="intel-box">
        [ CANLI HEDEF ANALİZİ ]<br>
        IP: <span id="user-ip">Sorgulanıyor...</span><br>
        CİHAZ: <span id="user-device">Tespit ediliyor...</span>
    </div>

    <div class="container">
        <h1>[ SFY CHAT ]</h1>
        <input type="text" placeholder="Mesajı yaz reisim...">
        <input type="text" placeholder="Şifre Anahtarı (Örn: 5)...">
        <button>SİSTEME GÖNDER VE ŞİFRELE</button>
        <a href="#" class="cyber-link">>> EMEĞİ GEÇENLER <<</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script>
        // SENİN KARARGAGAG PROJE BİLGİLERİN
        const firebaseConfig = {
            apiKey: "AIzaSyAzG0edMFVR9qhfHJWZCezmHI3VhbCsiA",
            authDomain: "karargagag.firebaseapp.com",
            projectId: "karargagag",
            storageBucket: "karargagag.appspot.com",
            messagingSenderId: "963269163069",
            appId: "1:963269163069:web:8793a0c305beb43c095254"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // IP ÇEK VE VERİTABANINA YAZ
        async function captureIntel() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                document.getElementById('user-ip').innerText = data.ip;
                document.getElementById('user-device').innerText = navigator.platform;

                // Veritabanına kaydet
                db.collection("ziyaretciler").doc(data.ip).set({
                    ip: data.ip,
                    cihaz: navigator.platform,
                    sistem: navigator.userAgent,
                    tarih: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                console.log("Hata:", err);
            }
        }
        captureIntel();
    </script>
</body>
</html>
